<!DOCTYPE html>
<html lang="uz" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MoneyTrack — Shaxsiy moliyaviy boshqaruv paneli</title>
  <meta name="description"
    content="MoneyTrack: kimga qancha pul berganingiz, kimdan olganingiz va pulingiz qayerga ketayotganini kuzatib boring.">
  <meta name="theme-color" content="#071030">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2362a0ff'/%3E%3Cstop offset='1' stop-color='%232a4cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M32 14l18 9-18 9-18-9z' fill='%23fff'/%3E%3Cpath d='M14 32l18 9 18-9M14 41l18 9 18-9' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <!-- Shrift: internet bo'lmasa tizim shrifti ishlatiladi -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#080808">

  <!-- Tema "chaqnab" ketmasligi uchun sahifa chizilishidan oldin o'rnatiladi -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem("moneytrack.v1"));
      var t = s && s.settings && s.settings.theme;
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { }
  </script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ===== Ikonalar to'plami ===== -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-layers" viewBox="0 0 24 24">
        <path d="M12 2.5l9.5 4.8L12 12 2.5 7.3z" />
        <path d="M2.5 12.2L12 17l9.5-4.8" />
        <path d="M2.5 17L12 21.7 21.5 17" />
      </symbol>
      <symbol id="i-home" viewBox="0 0 24 24">
        <path d="M3 11l9-8 9 8" />
        <path d="M5 9.5V20a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V9.5" />
      </symbol>
      <symbol id="i-swap" viewBox="0 0 24 24">
        <path d="M8 3L4 7l4 4" />
        <path d="M4 7h16" />
        <path d="M16 21l4-4-4-4" />
        <path d="M20 17H4" />
      </symbol>
      <symbol id="i-users" viewBox="0 0 24 24">
        <circle cx="9" cy="8" r="3.5" />
        <path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" />
        <path d="M16 4.6a3.5 3.5 0 010 6.8" />
        <path d="M18 14.4c2.2.7 3.5 2.7 3.5 5.6" />
      </symbol>
      <symbol id="i-chart" viewBox="0 0 24 24">
        <path d="M5 21V11" />
        <path d="M12 21V4" />
        <path d="M19 21v-7" />
        <path d="M2.5 21h19" />
      </symbol>
      <symbol id="i-coin" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9.2" />
        <path
          d="M14.6 9.3c-.5-.8-1.4-1.3-2.6-1.3-1.5 0-2.6.8-2.6 2s1.1 1.7 2.6 2.1 2.6.9 2.6 2.1-1.1 2-2.6 2c-1.3 0-2.3-.5-2.7-1.4" />
        <path d="M12 5.8V8M12 16v2.2" />
      </symbol>
      <symbol id="i-backup" viewBox="0 0 24 24">
        <path d="M7 18.5a4.5 4.5 0 01-.7-8.9A6 6 0 0117.9 9.5 4.3 4.3 0 0117 18.5" />
        <path d="M12 11.5v8" />
        <path d="M8.7 16.3l3.3 3.2 3.3-3.2" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" />
        <path
          d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" />
        <path d="M21 21l-4.3-4.3" />
      </symbol>
      <symbol id="i-bell" viewBox="0 0 24 24">
        <path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9" />
        <path d="M10.3 21a1.9 1.9 0 003.4 0" />
      </symbol>
      <symbol id="i-down" viewBox="0 0 24 24">
        <path d="M6 9l6 6 6-6" />
      </symbol>
      <symbol id="i-right" viewBox="0 0 24 24">
        <path d="M9 6l6 6-6 6" />
      </symbol>
      <symbol id="i-left" viewBox="0 0 24 24">
        <path d="M15 6l-6 6 6 6" />
      </symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24">
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z" />
      </symbol>
      <symbol id="i-image" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2.5" />
        <circle cx="8.5" cy="8.5" r="1.6" />
        <path d="M21 15l-5-5L5 21" />
      </symbol>
      <symbol id="i-logout" viewBox="0 0 24 24">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
        <path d="M16 17l5-5-5-5" />
        <path d="M21 12H9" />
      </symbol>
      <symbol id="i-send" viewBox="0 0 24 24">
        <path d="M22 2L11 13" />
        <path d="M22 2l-7 20-4-9-9-4z" />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
        <path d="M7 10l5 5 5-5" />
        <path d="M12 15V3" />
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
        <path d="M17 8l-5-5-5 5" />
        <path d="M12 3v12" />
      </symbol>
      <symbol id="i-cart" viewBox="0 0 24 24">
        <circle cx="9" cy="21" r="1.2" />
        <circle cx="20" cy="21" r="1.2" />
        <path d="M1.5 1.5h3.8l2.6 13a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6.5H6" />
      </symbol>
      <symbol id="i-wallet" viewBox="0 0 24 24">
        <rect x="2.5" y="5" width="19" height="14" rx="3" />
        <path d="M2.5 10h19" />
        <path d="M16 15h2.5" />
      </symbol>
      <symbol id="i-ledger" viewBox="0 0 24 24">
        <rect x="4" y="3" width="16" height="18" rx="2.5" />
        <path d="M8 8h8M8 12h4" />
        <circle cx="16" cy="16.5" r="2.6" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M3 6h18" />
        <path d="M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2" />
        <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" />
        <path d="M10 11v6M14 11v6" />
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24">
        <path d="M18 6L6 18M6 6l12 12" />
      </symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="2.5" />
        <path d="M16 2v4M8 2v4M3 10h18" />
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24">
        <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24">
        <path d="M3 6h18M3 12h18M3 18h18" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="M20 6L9 17l-5-5" />
      </symbol>
      <symbol id="i-file" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
        <path d="M14 2v6h6" />
        <path d="M8 13h8M8 17h6" />
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z" />
        <path d="M12 9v4M12 17h.01" />
      </symbol>
      <symbol id="i-up" viewBox="0 0 24 24">
        <path d="M12 19V5M5 12l7-7 7 7" />
      </symbol>
      <symbol id="i-dn" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12l7 7 7-7" />
      </symbol>
      <symbol id="i-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" />
      </symbol>
      <symbol id="i-camera" viewBox="0 0 24 24">
        <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z" />
        <circle cx="12" cy="13" r="4" />
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M21 12a9 9 0 01-15.5 6.2L3 16" />
        <path d="M3 12A9 9 0 0118.5 5.8L21 8" />
        <path d="M21 3v5h-5M3 21v-5h5" />
      </symbol>
      <symbol id="i-pin" viewBox="0 0 24 24">
        <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1116 0z" />
        <circle cx="12" cy="10" r="3" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </symbol>
      <symbol id="i-shield" viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        <path d="M9 12l2 2 4-4" />
      </symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24">
        <path d="M13 2L4 14h7l-1 8 9-12h-7z" />
      </symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24">
        <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3" />
        <path d="M1 14h6M9 8h6M17 16h6" />
      </symbol>
    </defs>
  </svg>

  <div class="app">

    <!-- ===== Chap menyu ===== -->
    <aside class="sidebar panel" id="sidebar" aria-label="Asosiy menyu">
      <a class="brand" href="#/dashboard">
        <span class="brand-logo"><svg class="ic">
            <use href="#i-layers" />
          </svg></span>
        <span class="brand-text"><b>MoneyTrack</b><small>Pullaring nazoratda</small></span>
      </a>

      <nav class="nav" id="nav">
        <a class="nav-item" href="#/dashboard" data-route="dashboard"><svg class="ic">
            <use href="#i-home" />
          </svg><span>Bosh sahifa</span></a>
        <a class="nav-item" href="#/transactions" data-route="transactions"><svg class="ic">
            <use href="#i-swap" />
          </svg><span>Operatsiyalar</span></a>
        <a class="nav-item" href="#/people" data-route="people"><svg class="ic">
            <use href="#i-users" />
          </svg><span>Insonlar</span></a>
        <a class="nav-item" href="#/stats" data-route="stats"><svg class="ic">
            <use href="#i-chart" />
          </svg><span>Statistika</span></a>
        <a class="nav-item" href="#/currencies" data-route="currencies"><svg class="ic">
            <use href="#i-coin" />
          </svg><span>Valyutalar</span></a>
        <a class="nav-item" href="#/backup" data-route="backup"><svg class="ic">
            <use href="#i-backup" />
          </svg><span>Zaxira / Import</span></a>
        <a class="nav-item" href="#/settings" data-route="settings"><svg class="ic">
            <use href="#i-settings" />
          </svg><span>Sozlamalar</span></a>
      </nav>

      <div class="side-bottom">
        <figure class="quote" id="quote"></figure>
        <div class="theme-switch" role="group" aria-label="Mavzu">
          <svg class="ic">
            <use href="#i-sun" />
          </svg>
          <button class="switch" id="themeSwitch" data-act="theme" role="switch" aria-checked="false"
            aria-label="Qorong'i rejim"><i></i></button>
          <svg class="ic">
            <use href="#i-moon" />
          </svg>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="overlay" data-act="menu"></div>

    <!-- ===== Asosiy qism ===== -->
    <div class="shell">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-act="menu" aria-label="Menyuni ochish"><svg class="ic">
            <use href="#i-menu" />
          </svg></button>

        <label class="search">
          <svg class="ic">
            <use href="#i-search" />
          </svg>
          <input id="globalSearch" type="search" placeholder="Inson, izoh yoki operatsiyani qidiring..."
            autocomplete="off" aria-label="Qidiruv">
          <kbd>Ctrl + K</kbd>
        </label>

        <div class="top-right">
          <div class="dropdown">
            <button class="icon-btn bell" id="bellBtn" data-act="bell" aria-label="Bildirishnomalar"
              aria-haspopup="true"><svg class="ic">
                <use href="#i-bell" />
              </svg><i class="dot" id="bellDot" hidden></i></button>
            <div class="dd-panel dd-bell" id="bellPanel" hidden></div>
          </div>
          <div class="dropdown">
            <button class="user-chip" id="userBtn" data-act="user" aria-haspopup="true">
              <span id="userAv"></span>
              <span class="uc-text"><b id="userName">—</b><small>Foydalanuvchi</small></span>
              <svg class="ic sm">
                <use href="#i-down" />
              </svg>
            </button>
            <div class="dd-panel dd-user" id="userMenu" hidden>
              <button data-act="edit-profile"><svg class="ic">
                  <use href="#i-pencil" />
                </svg>Profilni tahrirlash</button>
              <button data-act="change-avatar"><svg class="ic">
                  <use href="#i-image" />
                </svg>Rasmini o'zgartirish</button>
              <a href="#/settings"><svg class="ic">
                  <use href="#i-settings" />
                </svg>Sozlamalar</a>
              <a href="#/backup"><svg class="ic">
                  <use href="#i-backup" />
                </svg>Zaxira nusxa</a>
            </div>
          </div>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Telefonda tez operatsiya qo'shish -->
  <button class="fab" data-act="add-tx" aria-label="Operatsiya qo'shish"><svg class="ic">
      <use href="#i-plus" />
    </svg></button>

  <div id="modalRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>

  <input type="file" id="fileAvatar" accept="image/*" hidden>
  <input type="file" id="fileImport" accept="application/json,.json" hidden>

  <noscript>
    <p style="padding:24px;color:#fff">MoneyTrack ishlashi uchun JavaScript yoqilgan bo'lishi kerak.</p>
  </noscript>
  <script src="./app.js"></script>
</body>

</html>
